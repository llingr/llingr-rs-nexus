name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build & doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07-15
        with:
          toolchain: stable
      - run: cargo build --all-targets --locked
      # Rustdoc warnings fail here rather than on docs.rs after publish
      # (missing docs are already a compile error via #![deny(missing_docs)]).
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

  test:
    name: test (coverage)
    # build & doc is quick; no point spinning up the coverage suite if the
    # code doesn't compile or document cleanly.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07-15
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-llvm-cov
      - name: Tests
        run: cargo llvm-cov --locked --lcov --output-path coverage.lcov
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.lcov
          fail_ci_if_error: false
