name: Release PR

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-pr:
    # Maintains the rolling release PR: version bump from conventional
    # commits (fix -> patch, feat -> minor, breaking -> major) plus
    # changelog. Merging that PR is the release decision.
    name: release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07-15
        with:
          toolchain: stable
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  tag:
    # After the release PR merges, the crate version is ahead of the last
    # tag; this pushes the matching v* tag, which fires release.yml (build,
    # attest, GitHub release, crates.io publish). No-op on ordinary pushes.
    name: push release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-plz-tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07-15
        with:
          toolchain: stable
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
