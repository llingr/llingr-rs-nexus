name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rustfmt-clippy:
    name: rustfmt & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07-15
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.20.2
      # Same commands as `make lint`, so CI and the pre-push default agree.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # deny.toml's licence boundary; advisories are cargo audit's job in Vulncheck
      - run: cargo deny check licenses bans sources
